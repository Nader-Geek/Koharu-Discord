name: Build headless

# Builds koharu-headless, the windowless Koharu worker the Discord bot talks
# to, for Linux x86-64 on Ubuntu 24.04 (glibc 2.39): what Colab's current
# runtime and Koharu's own native packages are built on.
#
# - A push to main that touches worker/ builds and keeps the binary as an
#   artifact (Actions → the run → Artifacts).
# - A tag such as v1 builds and attaches it to a GitHub release, which the
#   notebook downloads from releases/latest/download/koharu-headless.
# - Run workflow builds by hand, which is also how a change to this file is
#   tried out.

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'worker/**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-headless-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: koharu-headless (linux x86-64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Koharu commit
        id: pin
        run: echo "commit=$(tr -d '[:space:]' < worker/UPSTREAM_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out Koharu
        uses: actions/checkout@v7
        with:
          repository: koharu-rs/koharu
          ref: ${{ steps.pin.outputs.commit }}
          path: .build/koharu

      # bindgen reads the native libraries' headers with libclang.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libclang-dev \
            llvm \
            pkg-config \
            libssl-dev

      - run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/koharu
          shared-key: koharu-headless
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}

      - name: Build
        run: KOHARU_SRC="$GITHUB_WORKSPACE/.build/koharu" bash worker/build.sh

      - run: out/koharu-headless --help

      - uses: actions/upload-artifact@v7
        with:
          name: koharu-headless-linux-x86_64
          path: out/koharu-headless
          retention-days: 30

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="koharu-headless for Linux x86-64 (Ubuntu 24.04 / glibc 2.39), built from koharu-rs/koharu@${{ steps.pin.outputs.commit }}."
          gh release create "$GITHUB_REF_NAME" out/koharu-headless --title "$GITHUB_REF_NAME" --notes "$notes" \
            || gh release upload "$GITHUB_REF_NAME" out/koharu-headless --clobber
